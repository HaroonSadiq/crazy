name: Build Echo & Spark APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('EchoAndSpark/gradle.properties', 'EchoAndSpark/gradle/wrapper/gradle-wrapper.properties', 'EchoAndSpark/build.gradle.kts', 'EchoAndSpark/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run Gradle assembleDebug
        working-directory: EchoAndSpark
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoAndSpark-debug-apk
          path: EchoAndSpark/app/build/outputs/apk/debug/app-debug.apk
